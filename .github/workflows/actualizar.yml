name: Actualizar instantánea

# Regenera la instantánea del tablero desde datos.gov.co.
# El tablero además consulta la API en vivo al abrirse; esto mantiene fresco
# el respaldo que se muestra cuando la API no responde, y los CSV descargables.

on:
  schedule:
    - cron: "0 10,22 * * *"     # cada 12 horas: 5:00 a. m. y 5:00 p. m. en Colombia
  workflow_dispatch:            # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-instantanea
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar desde la API
        run: python scripts/actualizar.py

      - name: Rastrear el sismo del 10 de agosto
        run: python scripts/sismo.py

      - name: Construir la pagina del sismo
        run: python scripts/construir_sismo.py

      - name: Resumen
        run: |
          echo "### Instantánea regenerada" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat datos/instantanea.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          git diff --stat >> $GITHUB_STEP_SUMMARY || true

      - name: Publicar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios: la instantánea ya estaba al día."
            exit 0
          fi
          n=$(python -c "import json;d=json.load(open('datos/instantanea.json'));print(f\"{d['incluidos']} contratos, {d['sin_revisar']} sin revisar\")")
          git commit -m "Instantánea al $(date -u +%Y-%m-%d): ${n}"
          git push
